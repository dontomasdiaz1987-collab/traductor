<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traductor de voz</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1b1f27; --muted: #5d6675;
    --primary: #1565c0; --primary-text: #ffffff; --border: #d5dbe5; --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e8ecf3; --muted: #9aa5b8;
      --primary: #4d9bff; --primary-text: #08213f; --border: #2e3644; --danger: #ef5350;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 1.5rem; margin: 4px 0 16px; }
  .langs { display: flex; align-items: flex-end; gap: 8px; }
  .langs > div { flex: 1; min-width: 0; }
  label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 4px; }
  select, textarea, button { font: inherit; color: inherit; }
  select {
    width: 100%; height: 44px; padding: 0 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card);
  }
  .swap {
    width: 44px; height: 44px; flex: none; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card); cursor: pointer;
    font-size: 1.2rem; color: var(--primary);
  }
  .box { margin-top: 18px; }
  textarea, .out {
    width: 100%; min-height: 120px; padding: 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card);
    font-size: 1.25rem; line-height: 1.4; resize: vertical;
  }
  .out { white-space: pre-wrap; font-weight: 600; }
  .out:empty::before { content: attr(data-placeholder); color: var(--muted); font-weight: 400; }
  #status { margin: 12px 2px; min-height: 1.4em; color: var(--muted); font-size: .9rem; }
  #status.error { color: var(--danger); }
  .btn {
    width: 100%; height: 56px; border-radius: 14px; border: 0; cursor: pointer;
    font-size: 1.05rem; font-weight: 600; margin-top: 8px;
    background: var(--primary); color: var(--primary-text);
  }
  .btn.secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
  .btn.big { height: 68px; font-size: 1.2rem; }
  .btn.listening { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(198,40,40,.2); } }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }
  .notice {
    margin: 0 0 12px; padding: 12px 14px; border-radius: 12px; font-size: .9rem;
    line-height: 1.4; border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  .notice[hidden] { display: none; }
  small { display: block; margin-top: 16px; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>
<main>
  <h1>🌐 Traductor de voz</h1>

  <div class="langs">
    <div>
      <label for="from">Idioma de entrada</label>
      <select id="from"></select>
    </div>
    <button class="swap" id="swap" title="Invertir idiomas" aria-label="Invertir idiomas">⇄</button>
    <div>
      <label for="to">Idioma de salida</label>
      <select id="to"></select>
    </div>
  </div>

  <div class="box">
    <label for="original">Lo que dijiste (también puedes escribir aquí)</label>
    <textarea id="original" dir="auto" placeholder="Toca el micrófono y habla…"></textarea>
  </div>

  <div class="box">
    <label>Traducción</label>
    <div class="out" id="translated" dir="auto" data-placeholder="Aquí aparecerá la traducción"></div>
  </div>

  <div id="notice" class="notice" hidden></div>
  <div id="status" role="status">Listo</div>

  <button class="btn big" id="mic">🎤 Hablar</button>
  <div class="row">
    <button class="btn secondary" id="translateBtn">Traducir texto</button>
    <button class="btn secondary" id="listen">🔊 Escuchar</button>
  </div>

  <small>
    Uno de los dos idiomas siempre es español. El reconocimiento de voz funciona en
    Chrome, Edge y Safari (no en Firefox; ahí puedes escribir el texto y traducirlo).
    La traducción usa el servicio gratuito MyMemory, que requiere internet y tiene un
    límite diario de uso.
  </small>
</main>

<script>
const LANGS = [
  { code: 'es', name: 'Español',   tag: 'es-MX' },
  { code: 'en', name: 'English (US)', tag: 'en-US' },
  { code: 'en', name: 'English (UK)', tag: 'en-GB' },
  { code: 'fr', name: 'Français',  tag: 'fr-FR' },
  { code: 'de', name: 'Deutsch',   tag: 'de-DE' },
  { code: 'pt', name: 'Português', tag: 'pt-BR' },
  { code: 'it', name: 'Italiano',  tag: 'it-IT' },
  { code: 'zh-CN', name: '中文',    tag: 'zh-CN' },
  { code: 'ja', name: '日本語',     tag: 'ja-JP' },
  { code: 'ko', name: '한국어',     tag: 'ko-KR' },
  { code: 'ar', name: 'العربية',   tag: 'ar-SA' },
];

const $ = (id) => document.getElementById(id);
const fromSel = $('from'), toSel = $('to');
const original = $('original'), translated = $('translated');
const statusEl = $('status'), micBtn = $('mic'), listenBtn = $('listen');

LANGS.forEach((l, i) => {
  fromSel.add(new Option(l.name, i));
  toSel.add(new Option(l.name, i));
});
fromSel.value = 0;
toSel.value = 1;

let lastTranslatedLang = null;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
}

/* Si la página no se abrió desde https:// (por ejemplo desde WhatsApp o un
   archivo local), el navegador suele bloquear el micrófono. */
const NOT_HTTPS = location.protocol !== 'https:' &&
  location.hostname !== 'localhost' && location.hostname !== '127.0.0.1';
if (NOT_HTTPS) {
  const n = $('notice');
  n.textContent = 'Abriste la página desde un archivo local o desde WhatsApp. ' +
    'Ahí el navegador suele bloquear el micrófono. Si "Hablar" falla, escribe el texto ' +
    'y usa "Traducir texto", o abre la página desde una dirección https:// en Chrome.';
  n.hidden = false;
}
function micBlockedMessage() {
  return NOT_HTTPS
    ? 'El navegador bloqueó el micrófono porque la página no está en una dirección https://. ' +
      'Escribe el texto y pulsa "Traducir texto", o abre la página desde https:// en Chrome.'
    : 'Permiso de micrófono denegado. Actívalo en el candado de la barra de direcciones.';
}

/* --- Idiomas: exactamente uno de los dos debe ser español --- */
function keepSpanish(changed) {
  const f = +fromSel.value, t = +toSel.value;
  const other = changed === fromSel ? toSel : fromSel;
  if (f !== 0 && t !== 0) other.value = 0;
  else if (f === 0 && t === 0) other.value = 1;
}
fromSel.addEventListener('change', () => keepSpanish(fromSel));
toSel.addEventListener('change', () => keepSpanish(toSel));

$('swap').addEventListener('click', () => {
  const f = fromSel.value;
  fromSel.value = toSel.value;
  toSel.value = f;
  const text = original.value;
  original.value = translated.textContent;
  translated.textContent = text;
  lastTranslatedLang = null;
});

/* --- Micrófono (voz a texto) --- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if (!SR) {
  micBtn.disabled = true;
  micBtn.textContent = '🎤 Voz no disponible en este navegador';
}

function setListening(on) {
  listening = on;
  micBtn.classList.toggle('listening', on);
  micBtn.textContent = on ? '⏹ Detener' : '🎤 Hablar';
}

function startListening() {
  window.speechSynthesis.cancel();
  recognition = new SR();
  recognition.lang = LANGS[+fromSel.value].tag;
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  let finalText = '';
  original.value = '';
  translated.textContent = '';

  recognition.onstart = () => { setListening(true); setStatus('Escuchando…'); };
  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    original.value = (finalText + interim).trim();
  };
  recognition.onerror = (e) => {
    const msgs = {
      'not-allowed': micBlockedMessage(),
      'service-not-allowed': 'El navegador no permite el reconocimiento de voz aquí.',
      'no-speech': 'No se escuchó nada. Inténtalo de nuevo.',
      'audio-capture': 'No se encontró ningún micrófono.',
      'network': 'Error de red en el reconocimiento de voz.',
    };
    setStatus(msgs[e.error] || 'No se pudo reconocer la voz (' + e.error + ').', true);
  };
  recognition.onend = () => {
    setListening(false);
    const text = (finalText || original.value).trim();
    if (text) translateText(text);
    else if (!statusEl.classList.contains('error')) setStatus('Listo');
  };

  try { recognition.start(); }
  catch (err) { setStatus('No se pudo iniciar el micrófono.', true); }
}

micBtn.addEventListener('click', () => {
  if (listening) recognition.stop();
  else startListening();
});

/* --- Traducción (MyMemory) --- */
async function translateText(text) {
  const from = LANGS[+fromSel.value], to = LANGS[+toSel.value];
  if (from.code === to.code) { setStatus('Elige dos idiomas distintos.', true); return; }
  setStatus('Traduciendo…');
  try {
    const url = 'https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(text) + '&langpair=' + from.code + '|' + to.code;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (+data.responseStatus !== 200) throw new Error(data.responseDetails || 'Error');
    translated.textContent = data.responseData.translatedText;
    lastTranslatedLang = to;
    setStatus('Listo');
    speak(translated.textContent, to);   // salida automática por la bocina
  } catch (err) {
    setStatus('No se pudo traducir. Revisa tu conexión a internet o inténtalo más tarde.', true);
  }
}

$('translateBtn').addEventListener('click', () => {
  const text = original.value.trim();
  if (text) translateText(text);
});

/* --- Bocina (texto a voz) --- */
function speak(text, lang) {
  if (!text) {
    setStatus('Primero traduce algo para poder escucharlo.');
    return;
  }
  if (!('speechSynthesis' in window)) {
    setStatus('Tu navegador no soporta salida de voz.', true);
    return;
  }
  const synth = window.speechSynthesis;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang.tag;
  const voices = synth.getVoices();
  const voice = voices.find(v => v.lang.replace('_', '-').toLowerCase() === lang.tag.toLowerCase())
             || voices.find(v => v.lang.toLowerCase().startsWith(lang.tag.split('-')[0].toLowerCase()));
  if (voice) u.voice = voice;
  else if (voices.length) setStatus('Tu dispositivo no tiene una voz instalada para ' + lang.name + '.', true);
  synth.speak(u);
}

listenBtn.addEventListener('click', () => {
  speak(translated.textContent, lastTranslatedLang || LANGS[+toSel.value]);
});

// Algunas veces las voces se cargan tarde
if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
</script>
</body>
</html>
